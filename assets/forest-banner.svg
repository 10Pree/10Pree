<svg viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forest banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFEAF5"/>
      <stop offset="45%" stop-color="#6FAE8C"/>
      <stop offset="100%" stop-color="#0B3D2E"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .sway1 { transform-origin: 200px 300px; animation: sway 5s ease-in-out infinite; }
      .sway2 { transform-origin: 480px 300px; animation: sway 6s ease-in-out infinite -1s; }
      .sway3 { transform-origin: 760px 300px; animation: sway 4.5s ease-in-out infinite -2.3s; }
      .sway4 { transform-origin: 1020px 300px; animation: sway 5.5s ease-in-out infinite -0.6s; }
      .sway5 { transform-origin: 1250px 300px; animation: sway 6.5s ease-in-out infinite -3s; }
      @keyframes sway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }

      .fern { transform-origin: bottom center; animation: fernsway 3.6s ease-in-out infinite; }
      @keyframes fernsway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

      .leaf { opacity: 0; animation: fall 8s linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0,-30px) rotate(0deg); opacity: 0; }
        8%   { opacity: 0.9; } 92% { opacity: 0.85; }
        100% { transform: translate(60px,330px) rotate(220deg); opacity: 0; }
      }

      .glow { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.9; } }

      .firefly { animation: flicker 3.6s ease-in-out infinite; }
      @keyframes flicker {
        0%,100% { opacity: 0.15; transform: translate(0,0); }
        50%     { opacity: 1;    transform: translate(5px,-7px); }
      }

      .mist { animation: drift 15s ease-in-out infinite alternate; }
      @keyframes drift { 0% { transform: translateX(-45px); } 100% { transform: translateX(45px); } }

      .bird1 { animation: fly1 22s linear infinite; }
      @keyframes fly1 {
        0%   { transform: translate(-60px,60px); opacity:0; }
        6%   { opacity:1; } 94% { opacity:1; }
        100% { transform: translate(1460px,35px); opacity:0; }
      }
      .bird2 { animation: fly2 27s linear infinite -9s; }
      @keyframes fly2 {
        0%   { transform: translate(-60px,115px); opacity:0; }
        6%   { opacity:1; } 94% { opacity:1; }
        100% { transform: translate(1460px,90px); opacity:0; }
      }

      .owl-eye { transform-box: fill-box; transform-origin: center; animation: blink 5s ease-in-out infinite; }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

      .deer-head { transform-origin: 16px -8px; animation: graze 5s ease-in-out infinite; }
      @keyframes graze { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
      .deer-tail { transform-box: fill-box; transform-origin: center; animation: tailflick 2.4s ease-in-out infinite; }
      @keyframes tailflick { 0%,80%,100% { transform: rotate(0deg); } 90% { transform: rotate(18deg); } }

      .wing-l, .wing-r { transform-box: fill-box; transform-origin: right center; animation-duration: 0.5s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      .wing-r { transform-origin: left center; }
      @keyframes flap { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.35); } }
      .wing-l { animation-name: flap; }
      .wing-r { animation-name: flap; }
      .bfly1 { animation: bpath1 9s ease-in-out infinite; }
      @keyframes bpath1 {
        0%   { transform: translate(150px,190px); opacity:0; }
        10%  { opacity:1; }
        30%  { transform: translate(230px,150px); }
        55%  { transform: translate(310px,205px); }
        80%  { transform: translate(370px,160px); }
        92%  { opacity:1; }
        100% { transform: translate(410px,180px); opacity:0; }
      }
      .bfly2 { animation: bpath2 11s ease-in-out infinite -3s; }
      @keyframes bpath2 {
        0%   { transform: translate(1000px,210px); opacity:0; }
        10%  { opacity:1; }
        35%  { transform: translate(1080px,165px); }
        60%  { transform: translate(1150px,215px); }
        85%  { transform: translate(1220px,175px); }
        93%  { opacity:1; }
        100% { transform: translate(1260px,195px); opacity:0; }
      }

      .title { font-family: 'Trebuchet MS', Verdana, sans-serif; }
    ]]></style>
  </defs>

  <rect width="1400" height="300" fill="url(#sky)"/>
  <circle class="glow" cx="1180" cy="70" r="90" fill="url(#sun)"/>

  <g class="bird1"><path d="M0,10 Q10,-6 20,10 Q30,-6 40,10" stroke="#0B3D2E" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="bird2"><path d="M0,8 Q8,-5 16,8 Q24,-5 32,8" stroke="#12492F" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

  <!-- far tree row: hazy, small, atmospheric perspective -->
  <g fill="#9FD3C7" opacity="0.4">
    <polygon points="80,300 108,222 136,300"/>
    <polygon points="250,300 278,212 306,300"/>
    <polygon points="470,300 498,226 526,300"/>
    <polygon points="710,300 740,216 770,300"/>
    <polygon points="950,300 978,224 1006,300"/>
    <polygon points="1190,300 1220,218 1250,300"/>
    <polygon points="1330,300 1358,225 1386,300"/>
  </g>

  <!-- mid tree row -->
  <g fill="#2D6A4F" opacity="0.6">
    <polygon points="120,300 170,150 220,300"/>
    <polygon points="340,300 395,130 450,300"/>
    <polygon points="600,300 650,160 700,300"/>
    <polygon points="880,300 935,135 990,300"/>
    <polygon points="1100,300 1150,155 1200,300"/>
  </g>

  <!-- mist drifting between mid and near rows -->
  <ellipse class="mist" cx="380" cy="278" rx="260" ry="16" fill="#EAF7EE" opacity="0.22"/>
  <ellipse class="mist" cx="980" cy="285" rx="300" ry="18" fill="#EAF7EE" opacity="0.18" style="animation-duration:19s; animation-delay:-6s;"/>

  <!-- near tree row, swaying -->
  <g class="sway1" fill="#0B3D2E"><polygon points="160,300 200,110 240,300"/><rect x="192" y="296" width="16" height="18"/></g>
  <g class="sway2" fill="#0B3D2E"><polygon points="440,300 480,95 520,300"/><rect x="472" y="296" width="16" height="18"/></g>
  <g class="sway3" fill="#0B3D2E"><polygon points="720,300 760,105 800,300"/><rect x="752" y="296" width="16" height="18"/></g>
  <g class="sway4" fill="#0B3D2E"><polygon points="980,300 1020,90 1060,300"/><rect x="1012" y="296" width="16" height="18"/></g>
  <g class="sway5" fill="#0B3D2E"><polygon points="1210,300 1250,115 1290,300"/><rect x="1242" y="296" width="16" height="18"/></g>

  <!-- owl perched in the leftmost tree, clear of the title text -->
  <g transform="translate(200,132)">
    <ellipse cx="0" cy="0" rx="13" ry="16" fill="#3C2A21"/>
    <path d="M-13,-4 Q0,-19 13,-4 Q0,-9 -13,-4 Z" fill="#2A1D16"/>
    <circle class="owl-eye" cx="-5" cy="-3" r="4.2" fill="#FFD60A"/>
    <circle class="owl-eye" cx="5" cy="-3" r="4.2" fill="#FFD60A"/>
    <circle cx="-5" cy="-3" r="1.7" fill="#1B140F"/>
    <circle cx="5" cy="-3" r="1.7" fill="#1B140F"/>
    <polygon points="0,0 -2.5,4 2.5,4" fill="#E8A93A"/>
  </g>

  <!-- deer standing in the clearing -->
  <g transform="translate(850,262)" fill="#12100D" opacity="0.9">
    <ellipse class="deer-tail" cx="-24" cy="2" rx="4" ry="5"/>
    <ellipse cx="0" cy="0" rx="24" ry="13"/>
    <rect x="-16" y="10" width="5" height="20" rx="1.5"/>
    <rect x="-4" y="10" width="5" height="20" rx="1.5"/>
    <rect x="9" y="10" width="5" height="20" rx="1.5"/>
    <rect x="17" y="10" width="5" height="20" rx="1.5"/>
    <g class="deer-head">
      <path d="M16,-8 L30,-34 L22,-36 L10,-14 Z"/>
      <circle cx="27" cy="-36" r="7"/>
      <path d="M22,-42 L17,-54 M17,-54 L13,-50 M17,-54 L20,-58" stroke="#12100D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M32,-42 L37,-54 M37,-54 L41,-50 M37,-54 L34,-58" stroke="#12100D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- fireflies -->
  <circle class="firefly" filter="url(#glow)" cx="330" cy="220" r="2.6" fill="#FFD60A" style="animation-duration:3.2s;"/>
  <circle class="firefly" filter="url(#glow)" cx="560" cy="245" r="2.2" fill="#FFE066" style="animation-duration:4.1s; animation-delay:-1s;"/>
  <circle class="firefly" filter="url(#glow)" cx="830" cy="225" r="2.6" fill="#FFD60A" style="animation-duration:3.7s; animation-delay:-2.4s;"/>
  <circle class="firefly" filter="url(#glow)" cx="1060" cy="250" r="2.2" fill="#FFE066" style="animation-duration:4.4s; animation-delay:-0.5s;"/>
  <circle class="firefly" filter="url(#glow)" cx="640" cy="200" r="2" fill="#FFD60A" style="animation-duration:3.9s; animation-delay:-3s;"/>
  <circle class="firefly" filter="url(#glow)" cx="950" cy="210" r="2.4" fill="#FFE066" style="animation-duration:3.4s; animation-delay:-1.7s;"/>

  <!-- butterflies -->
  <g class="bfly1"><g class="wing-l"><ellipse cx="-4" cy="0" rx="5" ry="7" fill="#FFD60A" opacity="0.9"/></g><g class="wing-r"><ellipse cx="4" cy="0" rx="5" ry="7" fill="#FFD60A" opacity="0.9"/></g><line x1="0" y1="-5" x2="0" y2="5" stroke="#3C2A21" stroke-width="1.4"/></g>
  <g class="bfly2"><g class="wing-l"><ellipse cx="-4" cy="0" rx="4.5" ry="6" fill="#F1FAEE" opacity="0.92"/></g><g class="wing-r"><ellipse cx="4" cy="0" rx="4.5" ry="6" fill="#F1FAEE" opacity="0.92"/></g><line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#3C2A21" stroke-width="1.3"/></g>

  <!-- falling leaves -->
  <ellipse class="leaf" cx="90"   cy="0" rx="6" ry="10" fill="#95D5B2" style="animation-duration:7.5s; animation-delay:-1s;"/>
  <ellipse class="leaf" cx="260"  cy="0" rx="5" ry="9"  fill="#B7E4C7" style="animation-duration:9s;   animation-delay:-4s;"/>
  <ellipse class="leaf" cx="520"  cy="0" rx="6" ry="10" fill="#74C69D" style="animation-duration:8.2s; animation-delay:-2.5s;"/>
  <ellipse class="leaf" cx="700"  cy="0" rx="5" ry="9"  fill="#95D5B2" style="animation-duration:10s;  animation-delay:-6s;"/>
  <ellipse class="leaf" cx="900"  cy="0" rx="6" ry="10" fill="#B7E4C7" style="animation-duration:7.8s; animation-delay:-3.3s;"/>
  <ellipse class="leaf" cx="1080" cy="0" rx="5" ry="9"  fill="#74C69D" style="animation-duration:9.4s; animation-delay:-5s;"/>
  <ellipse class="leaf" cx="1320" cy="0" rx="6" ry="10" fill="#95D5B2" style="animation-duration:8.6s; animation-delay:-1.8s;"/>

  <!-- foreground brush framing the corners -->
  <path d="M0,300 Q25,262 55,300 Q78,270 105,300 Z" fill="#081F17"/>
  <path d="M1400,300 Q1372,260 1340,300 Q1318,268 1290,300 Z" fill="#081F17"/>

  <!-- foreground ferns -->
  <g class="fern" fill="#1B4332"><path d="M40,300 Q30,260 55,235 Q45,265 60,300 Z"/></g>
  <g class="fern" fill="#1B4332" style="animation-delay:-1.2s;"><path d="M1340,300 Q1330,255 1358,228 Q1345,260 1362,300 Z"/></g>
  <g class="fern" fill="#173D2A" style="animation-delay:-2s;"><path d="M1370,300 Q1362,265 1385,245 Q1374,270 1392,300 Z"/></g>

  <text x="700" y="165" text-anchor="middle" class="title" font-size="50" font-weight="700" fill="#FFFFFF">Nonthanan Simpree</text>
  <text x="700" y="205" text-anchor="middle" class="title" font-size="20" fill="#EAF7EE">Fullstack Developer · UX/UI Designer</text>
</svg>
