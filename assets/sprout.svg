<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="growing sprout" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style><![CDATA[
    .stem { transform-box: fill-box; transform-origin: bottom center; animation: grow 4s ease-in-out infinite; }
    @keyframes grow {
      0%   { transform: scaleY(0.15); }
      50%  { transform: scaleY(1); }
      85%  { transform: scaleY(1); }
      100% { transform: scaleY(0.15); }
    }
    .leaf1 { transform-box: fill-box; transform-origin: bottom left; animation: unfurl1 4s ease-in-out infinite; }
    .leaf2 { transform-box: fill-box; transform-origin: bottom right; animation: unfurl2 4s ease-in-out infinite; }
    @keyframes unfurl1 {
      0%,25%  { transform: scale(0) rotate(-20deg); opacity: 0; }
      55%,85% { transform: scale(1) rotate(0deg);   opacity: 1; }
      100%    { transform: scale(0) rotate(-20deg); opacity: 0; }
    }
    @keyframes unfurl2 {
      0%,30%  { transform: scale(0) rotate(20deg); opacity: 0; }
      60%,85% { transform: scale(1) rotate(0deg);  opacity: 1; }
      100%    { transform: scale(0) rotate(20deg); opacity: 0; }
    }
  ]]></style>
  <ellipse cx="30" cy="54" rx="16" ry="4" fill="#2D6A4F" opacity="0.5"/>
  <rect class="stem" x="28" y="20" width="4" height="34" fill="#40916C"/>
  <path class="leaf1" d="M30,32 Q14,28 12,16 Q26,18 30,32 Z" fill="#74C69D"/>
  <path class="leaf2" d="M30,26 Q46,22 48,10 Q34,12 30,26 Z" fill="#95D5B2"/>
</svg>
