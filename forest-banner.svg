<svg viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forest banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFEAF5"/>
      <stop offset="45%" stop-color="#6FAE8C"/>
      <stop offset="100%" stop-color="#0B3D2E"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .sway1 { transform-origin: 200px 300px; animation: sway 5s ease-in-out infinite; }
      .sway2 { transform-origin: 480px 300px; animation: sway 6s ease-in-out infinite -1s; }
      .sway3 { transform-origin: 760px 300px; animation: sway 4.5s ease-in-out infinite -2.3s; }
      .sway4 { transform-origin: 1020px 300px; animation: sway 5.5s ease-in-out infinite -0.6s; }
      .sway5 { transform-origin: 1250px 300px; animation: sway 6.5s ease-in-out infinite -3s; }
      @keyframes sway {
        0%,100% { transform: rotate(-1.4deg); }
        50%     { transform: rotate(1.4deg); }
      }
      .leaf { opacity: 0; animation: fall 8s linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0,-30px) rotate(0deg); opacity: 0; }
        8%   { opacity: 0.9; }
        92%  { opacity: 0.85; }
        100% { transform: translate(60px,330px) rotate(220deg); opacity: 0; }
      }
      .glow { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { opacity: 0.55; }
        50%     { opacity: 0.9; }
      }
      .title { font-family: 'Trebuchet MS', Verdana, sans-serif; }
    ]]></style>
  </defs>

  <rect width="1400" height="300" fill="url(#sky)"/>
  <circle class="glow" cx="1180" cy="70" r="90" fill="url(#sun)"/>

  <!-- distant tree row (further away, softer) -->
  <g fill="#2D6A4F" opacity="0.55">
    <polygon points="120,300 170,150 220,300"/>
    <polygon points="340,300 395,130 450,300"/>
    <polygon points="600,300 650,160 700,300"/>
    <polygon points="880,300 935,135 990,300"/>
    <polygon points="1100,300 1150,155 1200,300"/>
  </g>

  <!-- near tree row, each swaying independently -->
  <g class="sway1" fill="#0B3D2E"><polygon points="160,300 200,110 240,300"/><rect x="192" y="296" width="16" height="18"/></g>
  <g class="sway2" fill="#0B3D2E"><polygon points="440,300 480,95 520,300"/><rect x="472" y="296" width="16" height="18"/></g>
  <g class="sway3" fill="#0B3D2E"><polygon points="720,300 760,105 800,300"/><rect x="752" y="296" width="16" height="18"/></g>
  <g class="sway4" fill="#0B3D2E"><polygon points="980,300 1020,90 1060,300"/><rect x="1012" y="296" width="16" height="18"/></g>
  <g class="sway5" fill="#0B3D2E"><polygon points="1210,300 1250,115 1290,300"/><rect x="1242" y="296" width="16" height="18"/></g>

  <!-- falling leaves, staggered timing so they drift independently -->
  <ellipse class="leaf" cx="90"   cy="0" rx="6" ry="10" fill="#95D5B2" style="animation-duration:7.5s; animation-delay:-1s;"/>
  <ellipse class="leaf" cx="260"  cy="0" rx="5" ry="9"  fill="#B7E4C7" style="animation-duration:9s;   animation-delay:-4s;"/>
  <ellipse class="leaf" cx="520"  cy="0" rx="6" ry="10" fill="#74C69D" style="animation-duration:8.2s; animation-delay:-2.5s;"/>
  <ellipse class="leaf" cx="700"  cy="0" rx="5" ry="9"  fill="#95D5B2" style="animation-duration:10s;  animation-delay:-6s;"/>
  <ellipse class="leaf" cx="900"  cy="0" rx="6" ry="10" fill="#B7E4C7" style="animation-duration:7.8s; animation-delay:-3.3s;"/>
  <ellipse class="leaf" cx="1080" cy="0" rx="5" ry="9"  fill="#74C69D" style="animation-duration:9.4s; animation-delay:-5s;"/>
  <ellipse class="leaf" cx="1320" cy="0" rx="6" ry="10" fill="#95D5B2" style="animation-duration:8.6s; animation-delay:-1.8s;"/>

  <text x="700" y="165" text-anchor="middle" class="title" font-size="50" font-weight="700" fill="#FFFFFF">Nonthanan Simpree</text>
  <text x="700" y="205" text-anchor="middle" class="title" font-size="20" fill="#EAF7EE">Fullstack Developer · UX/UI Designer</text>
</svg>
